<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | escape }}">
<meta name="theme-color" content="#050806">
<meta property="og:type" content="{% if page.layout == 'portfolio_article' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.layout == 'portfolio_article' %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% for tag in page.tags %}<meta property="article:tag" content="{{ tag | escape }}">{% endfor %}{% endif %}
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<script>
    (function () {
        var savedTheme = localStorage.getItem("portfolio-theme");
        var theme = savedTheme || "dark";
        document.documentElement.dataset.theme = theme;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute("content", theme === "light" ? "#fbfbfa" : "#050806");
    }());
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<title>{{ page.title | default: site.title }}{% unless page.url == '/' %} · {{ site.title }}{% endunless %}</title>
{% if site.analytics.provider == "google-gtag" and site.analytics.google.tracking_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "{{ site.analytics.google.tracking_id }}", { "anonymize_ip": true });
</script>
{% endif %}
