<!doctype html>
<html lang="en">
<head>
    {% include portfolio-head.html %}
</head>
<body class="portfolio-page {{ page.classes }}">
    <a class="portfolio-skip-link" href="#main-content">Skip to content</a>
    {% include portfolio-header.html %}
    <main id="main-content" class="portfolio-main portfolio-main--reading">
        <div class="portfolio-page-heading">
            {% if page.eyebrow %}<p class="portfolio-eyebrow">{{ page.eyebrow }}</p>{% endif %}
            <h1>{{ page.title }}</h1>
            {% if page.excerpt %}<p class="portfolio-page-heading__lede">{{ page.excerpt }}</p>{% endif %}
        </div>
        <article class="portfolio-prose">
            {{ content }}
        </article>
    </main>
    {% include portfolio-footer.html %}
</body>
</html>
